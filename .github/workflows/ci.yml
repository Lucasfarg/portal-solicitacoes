name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      # Testcontainers sobe um PostgreSQL 18 usando o Docker do próprio runner.
      - name: Testes e2e da API
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
