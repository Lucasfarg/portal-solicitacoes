server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # O bundle (PO UI incluso) tem 3,6 MB; comprimido, trafega com cerca de um quinto disso.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Mesma origem para o navegador: "/" é o SPA e "/api" é a API.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Este nginx é a borda: sobrescreve o cabeçalho com o IP que ele mesmo viu,
    # para o cliente não forjar outro IP e escapar do limite de tentativas de login.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Os .js e .css do build levam um hash no nome: o conteúdo de um nome nunca muda, e o
  # navegador pode guardá-los por um ano.
  location ~ "-[0-9A-Z]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rotas do Angular caem no index.html, que é sempre conferido com o servidor: é ele que
  # aponta para os arquivos do build atual.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
