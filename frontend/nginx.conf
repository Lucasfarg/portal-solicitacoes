server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mesma origem para o navegador: "/" é o SPA e "/api" é a API.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Este nginx é a borda: sobrescreve o cabeçalho com o IP que ele mesmo viu,
    # para o cliente não forjar outro IP e escapar do limite de tentativas de login.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rotas do Angular caem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
