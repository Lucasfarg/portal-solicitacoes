<a class="skip-link link" href="#conteudo" (click)="skipToContent($event)">
  Pular para o conteúdo
</a>

<div class="shell">
  <header class="topbar">
    <button
      type="button"
      class="menu-toggle native-button"
      aria-controls="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      Menu
    </button>
    <p class="brand">Portal de Solicitações Internas</p>
    @if (user(); as user) {
      <p class="user">{{ user.name }} ({{ roleLabels[user.role] }})</p>
    }
    <po-button p-label="Sair" p-icon="an an-sign-out" (p-click)="logout()" />
  </header>

  <nav id="menu" class="menu" aria-label="Menu principal" [class.menu-open]="menuOpen()">
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a
            routerLinkActive="menu-current"
            ariaCurrentWhenActive="page"
            [routerLink]="link.path"
            [routerLinkActiveOptions]="samePath"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <main id="conteudo" #main class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>

<app-confirm-dialog />
