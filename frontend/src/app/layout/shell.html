<a class="skip-link link" href="#conteudo" (click)="skipToContent($event)">
  Pular para o conteúdo
</a>

<div class="po-wrapper">
  <po-toolbar
    appToolbarA11y
    p-title="Portal de Solicitações Internas"
    [p-profile]="profile()"
    [p-profile-actions]="profileActions"
  />

  <po-menu
    appMenuA11y
    p-logo="logo.svg"
    p-short-logo="logo.svg"
    p-logo-alt="Portal de Solicitações"
    [p-menus]="menus()"
  />

  <main id="conteudo" #main tabindex="-1">
    <router-outlet />
  </main>
</div>

<app-confirm-dialog />
