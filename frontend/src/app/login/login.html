<main>
  <po-page-login
    p-product-name="Portal de Solicitações Internas"
    p-environment="Demonstração"
    p-logo="logo.svg"
    p-background="login-bg.svg"
    [p-hide-remember-user]="true"
    [p-no-autocomplete-login]="false"
    [p-no-autocomplete-password]="false"
    [p-languages]="[]"
    [p-literals]="literals"
    [p-loading]="loading()"
    [p-password-errors]="errors()"
    (p-login-change)="failure.set(null)"
    (p-password-change)="failure.set(null)"
    (p-login-submit)="submit($event)"
  />
  <!-- O po-page-login mostra o erro embaixo da senha, mas não o anuncia ao leitor de tela. -->
  <p class="login-failure" role="alert">{{ failure() }}</p>
</main>
