services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    # Só nesta máquina (127.0.0.1): o compose serve em HTTP, então nada dele fica exposto à rede.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # No PostgreSQL 18 os dados ficam em /var/lib/postgresql/18/docker;
      # o volume é montado no diretório pai, não mais em .../data.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Só a API: a última etapa do Dockerfile é a imagem de hospedagem, com o frontend junto.
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-portal}@db:5432/${POSTGRES_DB:-portal}
      PORT: 3000
      # Configuração da API vinda do .env da raiz (o compose lê o .env sozinho para estas
      # substituições); sem valor no .env, valem os padrões da própria API.
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Fortaleza}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-8}
      HTTPS_ONLY: ${HTTPS_ONLY:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # A API não publica porta: só o nginx (web), na rede interna do compose, fala com ela.
      # Por isso o X-Forwarded-For vindo dessa rede é aceito.
      TRUST_PROXY: uniquelocal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      # Na primeira subida a API aplica as migrações e o seed antes de ouvir: falhas nesse
      # intervalo não contam, para uma máquina lenta não marcar a API como "unhealthy".
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # Só nesta máquina: em HTTP, o cookie de sessão não pode trafegar pela rede.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
